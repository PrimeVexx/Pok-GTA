<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Poké Vice City 3D</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0e1a;font-family:system-ui,sans-serif;user-select:none;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:#fff}
  .top-right{position:absolute;top:14px;right:16px;text-align:right;text-shadow:0 2px 4px #000}
  .money{font-size:22px;font-weight:900;color:#4cd964}
  .stars{font-size:18px;letter-spacing:3px;color:#ffd700;margin-top:2px}
  .bar-wrap{width:140px;height:10px;background:#0009;border:1px solid #fff4;border-radius:5px;margin-left:auto;margin-top:6px;overflow:hidden}
  .bar-hp{width:100%;height:100%;background:linear-gradient(90deg,#ff3b30,#ff9500)}
  #tip{position:absolute;top:14px;left:16px;background:#0008;padding:8px 12px;border-radius:8px;font-size:12px;border:1px solid #ffffff22;backdrop-filter:blur(4px)}
  #joy{position:absolute;left:24px;bottom:24px;width:110px;height:110px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44;pointer-events:auto}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffffaa;pointer-events:none}
  .btns{position:absolute;right:22px;bottom:24px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .btn{width:68px;height:68px;border-radius:50%;border:2px solid #fff6;background:#0009;color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 12px #0008}
  .btn-atk{background:radial-gradient(circle,#ff5e3a,#d82820);border-color:#ffd700}
  .btn-car{background:radial-gradient(circle,#2b8ed1,#154c79)}
</style>
<script src="https://cloudflare.com"></script>
</head>
<body>
<div id="hud">
  <div id="tip">🌆 <b>POKÉ VICE 3D</b><br>PC: WASD mover · Mouse girar · F auto · Clic disparar<br>Móvil: Joystick izq. · Arrastrar pantalla girar</div>
  <div class="top-right">
    <div class="money" id="cash">$ 00001500</div>
    <div class="stars" id="stars">★ ☆ ☆ ☆ ☆</div>
    <div class="bar-wrap"><div class="bar-hp" id="hp"></div></div>
    <div style="font-size:11px;margin-top:4px;color:#98e0ff" id="speed">A PIE</div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div class="btns">
    <div class="btn btn-car" id="bCar">🚗<br>AUTO</div>
    <div class="btn btn-atk" id="bAtk">⚡<br>ATACAR</div>
  </div>
</div>

<script>
// 1. Escena, Cámara y Renderizador optimizado para móviles (60 FPS)
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a103c);
scene.fog = new THREE.FogExp2(0x1a103c, 0.0085);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// 2. Iluminación realista estilo atardecer Vice City
const hemi = new THREE.HemisphereLight(0xffb480, 0x1e2b4d, 0.75);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffaa55, 1.25);
sun.position.set(50, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 200;
const d = 65;
sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
scene.add(sun);

// 3. Suelo, Calles Asfaltadas con Reflejo y Ciudad
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e242b, roughness: 0.45, metalness: 0.25 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x12151a, roughness: 0.3, metalness: 0.4 });
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
for (let i = -120; i <= 120; i += 40) {
  const rx = new THREE.Mesh(new THREE.PlaneGeometry(400, 10), roadMat);
  rx.rotation.x = -Math.PI / 2; rx.position.set(0, 0.02, i);
  scene.add(rx);

  const rz = new THREE.Mesh(new THREE.PlaneGeometry(10, 400), roadMat);
  rz.rotation.x = -Math.PI / 2; rz.position.set(i, 0.02, 0);
  scene.add(rz);

  const lx = new THREE.Mesh(new THREE.PlaneGeometry(400, 0.25), lineMat);
  lx.rotation.x = -Math.PI / 2; lx.position.set(0, 0.03, i);
  scene.add(lx);
}

// Edificios y Centro Pokémon de Neón
const colliders = new Array();
function addBuilding(x, z, w, h, d, col, neonCol) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.5, metalness: 0.2 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  colliders.push({ x, z, hw: w / 2 + 1, hd: d / 2 + 1 });

  if (neonCol) {
    const neon = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.6, d + 0.3), new THREE.MeshBasicMaterial({ color: neonCol }));
    neon.position.set(x, h - 1.5, z);
    scene.add(neon);
  }
}

addBuilding(0, -24, 18, 10, 14, 0xf2f4f8, 0xff2a55);
const bCols = new Array(0x24344d, 0x2e4057, 0x1b263b, 0x3a2e5c);
const nCols = new Array(0x00f0ff, 0xff00aa, 0xffd700, 0x4cd964);
for (let gx = -100; gx <= 100; gx += 40) {
  for (let gz = -100; gz <= 100; gz += 40) {
    if (Math.abs(gx) < 25 && Math.abs(gz) < 35) continue;
    const h = 14 + Math.abs((gx * 7 + gz * 13) % 28);
    addBuilding(gx + 20, gz + 20, 22, h, 22, bCols[Math.abs(gx + gz) % 4], nCols[Math.abs(gx) % 4]);
  }
}

// 4. Jugador 3D + Pikachu 3D acompañante
const player = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.55), new THREE.MeshStandardMaterial({ color: 0xe82820, roughness: 0.4 }));
body.position.y = 1.15; body.castShadow = true;
const head = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.65, 0.65), new THREE.MeshStandardMaterial({ color: 0xffd2a6 }));
head.position.y = 2.15; head.castShadow = true;
const cap = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 0.8), new THREE.MeshStandardMaterial({ color: 0xd82820 }));
cap.position.set(0, 2.5, 0.08);
player.add(body, head, cap);
player.position.set(0, 0, 6);
scene.add(player);

const pika = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.75, 0.55), new THREE.MeshStandardMaterial({ color: 0xffd828, roughness: 0.4 }));
pBody.position.y = 0.5; pBody.castShadow = true;
const earL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.55, 0.14), new THREE.MeshStandardMaterial({ color: 0xffd828 }));
earL.position.set(-0.22, 1.05, 0); earL.rotation.z = 0.25;
const earR = earL.clone(); earR.position.x = 0.22; earR.rotation.z = -0.25;
pika.add(pBody, earL, earR);
pika.position.set(1.8, 0, 6);
scene.add(pika);

// 5. Auto Deportivo 3D manejable
const car = new THREE.Group();
const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.85, 4.4), new THREE.MeshStandardMaterial({ color: 0xff2244, roughness: 0.2, metalness: 0.7 }));
chassis.position.y = 0.7; chassis.castShadow = true;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.65, 2.2), new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.1, metalness: 0.9 }));
cabin.position.set(0, 1.35, -0.2);
const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffcc }));
hl1.position.set(-0.7, 0.75, 2.21);
const hl2 = hl1.clone(); hl2.position.x = 0.7;
car.add(chassis, cabin, hl1, hl2);
car.position.set(8, 0, 2);
scene.add(car);
